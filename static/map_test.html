<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AMap Fix Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
#mapDiv{width:100%;height:100%}
#status{position:fixed;top:10px;right:10px;background:rgba(0,0,0,.8);color:#fff;padding:8px 14px;border-radius:6px;font:13px monospace;z-index:9999}
</style>
</head>
<body>
<div id="mapDiv"></div>
<div id="status">初始化...</div>
<script>
var s=document.getElementById('status');
function status(msg){s.textContent=msg;console.log(msg);}
status('Setting security config...');
window._AMapSecurityConfig = { securityJsCode: '654b5821c6b564d63ce1bea94d3ab16d' };
</script>
<script src="https://webapi.amap.com/maps?v=1.4.15&key=67b0518fb9e4f2039c9feafd773db12d"></script>
<script>
window.onload=function(){
  status('AMap SDK loaded, init map...');
  try{
    // Use custom tile layer with verified working URL
    var roadLayer=new AMap.TileLayer({
      getTileUrl:function(x,y,z){
        var s=(x+y)%4+1;
        return 'https://webrd0'+s+'.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x='+x+'&y='+y+'&z='+z;
      },
      zIndex:1
    });

    var map=new AMap.Map('mapDiv',{
      zoom:12,
      center:[139.69,35.69],
      resizeEnable:true,
      layers:[roadLayer]
    });

    status('Map created — check if tiles visible now');
    console.log('Map:',map.getSize());

    // Count tile loads
    var loaded=0;
    roadLayer.on('complete',function(){
      loaded++;
      status('Tiles loaded: '+loaded+' batches');
    });

    setTimeout(function(){
      status(loaded>0?'Tiles loaded: '+loaded+' ✓':'No tiles loaded — check Network tab for is.autonavi.com');
    },5000);

  }catch(e){
    status('ERROR: '+e.message);
    console.error(e);
  }
};
</script>
</body>
</html>
